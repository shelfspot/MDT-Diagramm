
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MDT Platzierungsverlauf</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #101014;
    color: #f5c65c;
    font-family: Arial, sans-serif;
  }
  .chart-box {
    padding: 15px 10px;
    width: 100%;
    height: 320px;
    background: #17171d;
    border: 1px solid #a67b28;
    border-radius: 14px;
  }
  canvas { width: 100% !important; }
</style>
</head>
<body>
<div class="chart-box">
  <canvas id="ranking"></canvas>
</div>

<script>
const params = new URLSearchParams(location.search);

const defaultDays = Array.from(
  {length: 14}, (_, i) => i + 1
);

const defaultRanks = [
  5,4,7,9,9,10,11,11,11,11,10,9,10,11
];

function readNumbers(key, fallback) {
  const value = params.get(key);
  if (!value) return fallback;
  const numbers = value.split(",").map(Number);
  if (!numbers.length ||
      numbers.some(n => !Number.isFinite(n))) {
    return fallback;
  }
  return numbers;
}

const days = readNumbers("days", defaultDays);
const ranks = readNumbers("ranks", defaultRanks);

const valid = days.length === ranks.length &&
  days.length > 0 &&
  days.every(n => Number.isInteger(n) && n > 0) &&
  ranks.every(n => Number.isInteger(n) && n >= 1 && n <= 28);

if (valid) {
  new Chart(document.getElementById("ranking"), {
    type: "line",
    data: {
      labels: days.map(String),
      datasets: [{
        label: "Platzierung",
        data: ranks,
        borderColor: "#f5c65c",
        backgroundColor: "rgba(245,198,92,.12)",
        pointBackgroundColor: "#ffd76c",
        pointRadius: 3,
        borderWidth: 3,
        tension: 0.25,
        fill: true
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {display: false}
      },
      scales: {
        x: {
          title: {
            display: true,
            text: "Spieltag",
            color: "#ddd"
          },
          ticks: {color: "#ddd"},
          grid: {color: "#303038"}
        },
        y: {
          reverse: true,
          min: 1,
          max: 28,
          ticks: {
            color: "#ddd",
            stepSize: 3
          },
          grid: {color: "#303038"}
        }
      }
    }
  });
}
</script>
</body>
</html>
